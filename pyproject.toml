[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matythekid-deploy_jd039"
version = "0.1.0"
description = "把候选项映射到类别上，算出模型部署工程师·多租户的显存隔离的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "matythekid" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://matythekid.github.io"
Repository = "https://github.com/matythekid/deploy_jd039"
Issues = "https://github.com/matythekid/deploy_jd039/issues"

[project.scripts]
deploy_jd039 = "deploy_jd039:main"

[tool.setuptools]
py-modules = ["deploy_jd039"]
